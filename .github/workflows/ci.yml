name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.0"

      - name: Install dependencies (locked, CPU-only PyTorch)
        run: uv sync --frozen --extra cpu

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Acquire pinned FastAPI corpus
        run: ./scripts/acquire_corpus.sh

      # DEEPSEEK_API_KEY is a placeholder: the app lifespan constructs the
      # OpenAI client, but these tests override it with a fake and make no API
      # calls. Tests needing PostgreSQL, Qdrant, or the model cache are marked
      # "integration" and excluded here.
      - name: Backend tests (service-free)
        env:
          DEEPSEEK_API_KEY: ci-dummy-key
        run: uv run pytest -q -m "not integration"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (locked)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
