[project]
name = "production-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sarang Dave", email = "131434471+S84v@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "deepeval>=4,<5",
    "fastapi>=0.141.1",
    "markdown-it-py>=4.2.0",
    "openai>=3.5.0",
    "opentelemetry-api>=1.37,<2",
    "opentelemetry-sdk>=1.37,<2",
    "opentelemetry-instrumentation-fastapi>=0.58b0,<1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.2",
    "qdrant-client>=1.19,<2",
    "sentence-transformers>=6.0.0",
    "sqlalchemy>=2.0.51",
    "uvicorn>=0.52.1",
]

[project.scripts]
production-rag = "production_rag:main"

[project.optional-dependencies]
# CPU-only PyTorch (no CUDA), resolved from the official PyTorch CPU index.
# Selected by Docker and CI via `uv sync --extra cpu`; the installed wheel
# carries a `+cpu` local version. `gpu` is a counterpart extra that keeps the
# existing default (PyPI) build; it exists so `cpu` can be declared conflicting
# and never affects a plain `uv sync`.
cpu = ["torch==2.13.0"]
gpu = ["torch==2.13.0"]

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.10.0",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.2",
]

[tool.uv]
# `cpu` and the default build are mutually exclusive, so the CPU extra never
# affects a plain `uv sync`.
conflicts = [[{ extra = "cpu" }, { extra = "gpu" }]]

[tool.uv.sources]
# `cpu` selects the CPU-only index; `gpu` (and a plain `uv sync`) use the
# default index (PyPI).
torch = [
    { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform != 'darwin'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 88
target-version = "py312"
src=["src"]

[tool.ruff.lint]
select = [
"E",    #pycodestyle
"F",    #pyflakes
"I",    #isort
"UP",   #pyupgrade
"B",    #bugbear
"SIM",  #simplify
]

ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "integration: tests that require external services (PostgreSQL, Qdrant, or model/API access)",
]
